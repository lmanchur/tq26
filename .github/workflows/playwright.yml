name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for --only-changed against the PR base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run changed Playwright tests
        if: github.event_name == 'pull_request'
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
          # BearStore demo credentials are non-sensitive (plaintext OK).
          BEARSTORE_USERNAME: tq26authsetup
          BEARSTORE_PASSWORD: Tq26Auth!Setup9
        run: npx playwright test --only-changed=origin/${{ github.base_ref }}
      - name: Run Playwright tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
          BEARSTORE_USERNAME: tq26authsetup
          BEARSTORE_PASSWORD: Tq26Auth!Setup9
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
